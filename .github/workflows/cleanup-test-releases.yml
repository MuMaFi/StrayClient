name: Remove pre-1.0 test releases

# One-off: v0.1.0–v0.3.0 were test builds. Runs once when this file is added
# (or manually), deletes those releases and their tags, then can be removed.
on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-test-releases.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete test releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for tag in v0.1.0 v0.2.0 v0.3.0; do
            if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes && echo "deleted release $tag"
            elif gh api "repos/$REPO/git/refs/tags/$tag" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" && echo "deleted tag $tag"
            else
              echo "$tag already gone"
            fi
          done
