name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# PR builds may be superseded; release builds on main must always finish
# (a cancelled macOS job is how a release ends up without its .dmg).
concurrency:
  group: ${{ github.workflow }}-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
      - name: Linux deps (for compiling the Tauri crate)
        timeout-minutes: 8
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p stray-core

  # Rebuild the Stray Capes mod against the real Minecraft 26.3 client, so a broken
  # change to mods/stray-client is caught before it ships inside the launcher.
  capes-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Download Minecraft 26.3 + Fabric libraries
        run: python3 mods/stray-client/fetch_deps.py 26.3 /tmp/mc
      - name: Compile
        run: mods/stray-client/build.sh /tmp/mc/client.jar /tmp/mc/libraries "$(command -v javac)"

  bundle:
    # Not gated on "check": that job needs Ubuntu package mirrors, and a mirror outage must not
    # stop a release (fmt, clippy and tests also run locally before every push).
    needs: [capes-mod]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Apple Silicon build, tuned for the M1 and newer (no universal fat binary).
          - name: macOS Apple Silicon (M1–M4)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            rustflags: -C target-cpu=apple-m1
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            rustflags: ""
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            rustflags: ""
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Optional secrets – see README. Without them the launcher builds fine but
      # Microsoft login / CurseForge need to be configured by the user.
      STRAY_MSA_CLIENT_ID: ${{ secrets.STRAY_MSA_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tauriScript: npx -y @tauri-apps/cli@2
          args: ${{ matrix.args }}
          # Pushes to main publish/update the GitHub Release for the current app version
          # (tag v<version> is created automatically). Bump the version to cut a new release.
          tagName: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) && 'v__VERSION__' || '' }}
          releaseName: "Stray Client v__VERSION__"
          releaseBody: "macOS: *_aarch64.dmg for Apple Silicon (M1–M4), *_x64.dmg for Intel Macs. Windows: *_x64-setup.exe. / macOS: *_aarch64.dmg для Apple Silicon (M1–M4), *_x64.dmg для Intel. Windows: *_x64-setup.exe."
          releaseDraft: false
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stray-launcher-${{ matrix.target }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
          if-no-files-found: error
