name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
      - name: Linux deps (for compiling the Tauri crate)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p stray-core

  bundle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # Optional secrets – see README. Without them the launcher builds fine but
      # Microsoft login / CurseForge need to be configured by the user.
      STRAY_MSA_CLIENT_ID: ${{ secrets.STRAY_MSA_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tauriScript: npx -y @tauri-apps/cli@2
          args: ${{ matrix.args }}
          # Pushes to main publish/update the GitHub Release for the current app version
          # (tag v<version> is created automatically). Bump the version to cut a new release.
          tagName: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) && 'v__VERSION__' || '' }}
          releaseName: "Stray Launcher v__VERSION__"
          releaseBody: "Download the .dmg for macOS or the -setup.exe for Windows. / Скачайте .dmg для macOS или -setup.exe для Windows."
          releaseDraft: false
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stray-launcher-${{ matrix.target }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
          if-no-files-found: error
