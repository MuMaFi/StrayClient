<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stray Client</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Start-up animation (skipped with a click, "fewer animations" or the setting) -->
  <div class="intro" id="intro" hidden>
    <div class="intro-glow"></div>
    <div class="intro-inner">
      <div class="intro-orb"><img src="assets/logo.svg" alt="" width="96" height="96" /><i></i><i></i></div>
      <div class="intro-word" id="intro-word" aria-label="Stray Client"></div>
      <div class="intro-bar"><i></i></div>
    </div>
  </div>
  <div class="drag" data-tauri-drag-region></div>

  <header class="top" data-tauri-drag-region>
    <a class="brand" data-page="home">
      <img src="assets/logo.svg" alt="" width="40" height="40" />
      <span>STRAY <b>CLIENT</b></span>
    </a>
    <nav class="nav">
      <button class="nav-btn active" data-page="home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span data-i18n="nav.home"></span>
      </button>
      <button class="nav-btn" data-page="mods">
        <svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7zM12 12 3 7m9 5 9-5m-9 5v10"/></svg>
        <span data-i18n="nav.mods"></span>
      </button>
      <button class="nav-btn" data-page="modules">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M17.5 14v7M14 17.5h7"/></svg>
        <span data-i18n="nav.modules"></span>
      </button>
      <button class="nav-btn" data-page="capes">
        <svg viewBox="0 0 24 24"><path d="M7 3h10l2 18-7-3-7 3z"/><path d="M9 3c0 2 1.3 3 3 3s3-1 3-3"/></svg>
        <span data-i18n="nav.wardrobe"></span>
      </button>
      <button class="nav-btn" data-page="settings">
        <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span data-i18n="nav.settings"></span>
      </button>
    </nav>
    <div class="top-right">
      <button class="social" data-url="https://www.tiktok.com/@strayzii" title="TikTok · StrayZii">
        <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.7a5.7 5.7 0 1 0 4.9 5.7V9.1a7.3 7.3 0 0 0 4.3 1.4V7.4a4.3 4.3 0 0 1-3.2-1.6z"/></svg>
      </button>
      <button class="social" data-url="https://tg.straysmp.cc" title="Telegram">
        <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M21.4 4.2 2.9 11.3c-1.3.5-1.2 1.2-.2 1.5l4.7 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.4l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.9-1.4-1.5zM8.2 13.9l9.5-6c.5-.3.9-.1.5.2l-8 7.3-.3 3.4z"/></svg>
      </button>
      <button class="social" data-url="https://ds.straysmp.cc" title="Discord">
        <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M19.3 5.3A16.5 16.5 0 0 0 15.2 4l-.5 1a15.3 15.3 0 0 0-5.4 0l-.5-1a16.4 16.4 0 0 0-4.1 1.3C2 9.2 1.3 13 1.6 16.8a16.6 16.6 0 0 0 5 2.5l1.1-1.7a10.7 10.7 0 0 1-1.7-.8l.4-.3a11.8 11.8 0 0 0 11.2 0l.4.3a10.7 10.7 0 0 1-1.7.8l1.1 1.7a16.5 16.5 0 0 0 5-2.5c.4-4.4-.7-8.2-3.1-11.5zM8.7 14.5c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm6.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg>
      </button>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="ru">RU</button><button data-lang="uk">UA</button><button data-lang="en">EN</button>
      </div>
      <button class="account" id="account">
        <img id="acc-head" alt="" width="28" height="28" />
        <span id="acc-name"></span>
        <svg class="acc-caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="acc-menu" id="acc-menu" hidden></div>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section class="page active" id="page-home">
      <div class="hero">
        <div class="hero-art"></div>
        <div class="hero-shade"></div>
        <div class="hero-content">
          <div class="hero-hello" id="hero-hello"></div>
          <h1 data-i18n="hero.title"></h1>
          <p data-i18n="hero.sub"></p>
          <div class="play-row">
            <button class="play" id="play">
              <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
              <span id="play-label" data-i18n="play"></span>
              <i class="play-fill" id="play-fill"></i>
            </button>
            <button class="version-pill prof-pill" id="prof-pill">
              <span data-i18n="prof.pill"></span>
              <b id="prof-pill-name"></b>
              <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <label class="version-pill">
              <span data-i18n="version"></span>
              <select id="version-select"></select>
            </label>
          </div>
          <div class="prof-menu" id="prof-menu" hidden></div>
          <div class="stage" id="stage"></div>
        </div>
        <div class="notch notch-ip">
          <button class="ip" id="mods-chip" data-page="mods">
            <svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7zM12 12 3 7m9 5 9-5m-9 5v10"/></svg>
            <span id="mods-chip-label"></span>
          </button>
        </div>
        <div class="notch notch-online">
          <div class="online-card">
            <div class="online-row">
              <span><span data-i18n="mem"></span> — <b id="mem-use">…</b><span class="muted" id="mem-total"></span></span>
              <span class="ping up" id="gc-label"></span>
            </div>
            <div class="bar"><i id="mem-bar"></i></div>
          </div>
        </div>
      </div>

      <div class="home-bar">
        <h3 class="home-new-only" data-i18n="home.profiles"></h3>
        <span class="home-bar-gap"></span>
        <div class="seg home-switch" id="home-switch">
          <button data-v="new" data-i18n="home.layout.new"></button>
          <button data-v="classic" data-i18n="home.layout.classic"></button>
        </div>
      </div>
      <div class="prof-strip home-new-only" id="prof-strip"></div>
      <div class="tiles home-new-only">
        <button class="tile" data-page="mods">
          <span class="tile-ico"><svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7zM12 12 3 7m9 5 9-5m-9 5v10"/></svg></span>
          <b data-i18n="nav.mods"></b><small id="tile-mods"></small>
        </button>
        <button class="tile" data-page="modules">
          <span class="tile-ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M17.5 14v7M14 17.5h7"/></svg></span>
          <b data-i18n="nav.modules"></b><small id="tile-modules"></small>
        </button>
        <button class="tile" data-page="capes">
          <span class="tile-ico"><svg viewBox="0 0 24 24"><path d="M7 3h10l2 18-7-3-7 3z"/><path d="M9 3c0 2 1.3 3 3 3s3-1 3-3"/></svg></span>
          <b data-i18n="nav.wardrobe"></b><small id="tile-wardrobe"></small>
        </button>
        <button class="tile" data-page="settings">
          <span class="tile-ico"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span>
          <b data-i18n="tile.perf"></b><small id="tile-perf"></small>
          <span class="bar tile-bar"><i id="tile-mem-bar"></i></span>
        </button>
      </div>

      <div class="cards home-classic-only">
        <div class="card perf">
          <div class="card-head">
            <div>
              <h3 data-i18n="perf.title"></h3>
              <p class="muted" data-i18n="perf.sub"></p>
            </div>
            <span class="chip chip-blue">Fabric</span>
          </div>
          <div class="core-mods">
            <div class="core-mod"><b>Sodium</b><span data-i18n="perf.fps"></span></div>
            <div class="core-mod"><b>FerriteCore</b><span data-i18n="perf.ram"></span></div>
          </div>
          <div class="extras">
            <span class="muted small" data-i18n="perf.extra"></span>
            <div class="extra-list" id="perf-extras"></div>
          </div>
        </div>
        <div class="card zii">
          <div class="zii-badge">
            <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.7a5.7 5.7 0 1 0 4.9 5.7V9.1a7.3 7.3 0 0 0 4.3 1.4V7.4a4.3 4.3 0 0 1-3.2-1.6z"/></svg>
          </div>
          <h3 data-i18n="zii.title"></h3>
          <p class="muted" data-i18n="zii.sub"></p>
          <div class="zii-actions">
            <button class="btn btn-soft" data-url="https://www.tiktok.com/@strayzii"><span>@StrayZii</span></button>
            <button class="btn btn-ghost" data-url="https://github.com/MuMaFi/StrayClient">GitHub</button>
          </div>
        </div>
      </div>
    </section>

    <!-- MODS -->
    <section class="page" id="page-mods">
      <div class="page-head">
        <div><h2 data-i18n="mods.title"></h2><p class="muted" data-i18n="mods.sub"></p></div>
      </div>
      <div class="mods-bar">
        <div class="tabs" id="mod-tabs">
          <button class="tab active" data-tab="installed"><span data-i18n="mods.installed"></span> <em id="installed-count"></em></button>
          <button class="tab" data-tab="modrinth">
            <svg viewBox="0 0 24 24" class="tab-ico"><path d="M12 3a9 9 0 1 0 9 9M12 7a5 5 0 1 0 5 5"/><path d="M14 10l7-7"/></svg>Modrinth</button>
          <button class="tab" data-tab="curseforge">
            <svg viewBox="0 0 24 24" class="tab-ico"><path d="M3 8h13l2-3h3l-1 5c-1 3-4 4-6 4l1 3h2v2H7v-2h2l1-3c-3 0-5-2-6-4z"/></svg>CurseForge</button>
        </div>
        <div class="search" id="search-wrap">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" autocomplete="off" spellcheck="false" />
        </div>
        <button class="btn btn-ghost" id="open-mods" data-i18n="mods.openFolder"></button>
      </div>
      <div class="notice" id="mods-notice" hidden></div>
      <div class="mod-grid" id="mod-grid"></div>
      <button class="btn btn-ghost more" id="more" hidden data-i18n="mods.more"></button>
    </section>

    <!-- SETTINGS -->
    <!-- MODULES -->
    <section class="page" id="page-modules">
      <div class="page-head">
        <div><h2 data-i18n="mod.title"></h2><p class="muted" data-i18n="mod.sub"></p></div>
      </div>
      <div class="notice hud-tip"><span data-i18n="mod.hud"></span></div>
      <div class="notice" id="prof-notice" hidden></div>
      <div class="notice" id="ks-notice" hidden></div>
      <div class="module-card card">
        <div class="module-top">
          <div class="module-ico"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></div>
          <div class="module-text">
            <h3>Keystrokes</h3>
            <p class="muted" data-i18n="ks.desc"></p>
          </div>
          <label class="toggle big"><input type="checkbox" id="ks-enabled" /><i></i></label>
        </div>
        <div class="module-body">
          <div class="ks-preview" id="ks-preview" tabindex="0">
            <div class="ks-row ks-keys"><span></span><b data-k="KeyW">W</b><span></span></div>
            <div class="ks-row ks-keys"><b data-k="KeyA">A</b><b data-k="KeyS">S</b><b data-k="KeyD">D</b></div>
            <div class="ks-row ks-mouse"><b data-m="0">LMB<small id="cps-l">0 CPS</small></b><b data-m="2">RMB<small id="cps-r">0 CPS</small></b></div>
            <div class="ks-row ks-space"><b data-k="Space"><i></i></b></div>
            <div class="ks-row ks-extra"><b class="ks-fps">FPS <em>240</em></b><b class="ks-ping">Ping <em>38 ms</em></b></div>
            <p class="ks-try muted" data-i18n="ks.try"></p>
          </div>
          <div class="ks-options">
            <label class="toggle"><input type="checkbox" data-ks="keys" /><i></i><span data-i18n="ks.keys"></span></label>
            <label class="toggle"><input type="checkbox" data-ks="mouse" /><i></i><span data-i18n="ks.mouse"></span></label>
            <label class="toggle"><input type="checkbox" data-ks="space" /><i></i><span data-i18n="ks.space"></span></label>
            <label class="toggle"><input type="checkbox" data-ks="fps" /><i></i><span data-i18n="ks.fps"></span></label>
            <label class="toggle"><input type="checkbox" data-ks="ping" /><i></i><span data-i18n="ks.ping"></span></label>
            <p class="muted small" data-i18n="ks.hint"></p>
          </div>
        </div>
      </div>

      <div class="notice" id="pvp-notice" hidden></div>
      <div class="module-card card" id="pvp-card">
        <div class="module-top">
          <div class="module-ico"><svg viewBox="0 0 24 24"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/></svg></div>
          <div class="module-text">
            <h3>PvP Plus</h3>
            <p class="muted" data-i18n="pvp.desc"></p>
          </div>
          <label class="toggle big"><input type="checkbox" id="pvp-enabled" /><i></i></label>
        </div>
        <div class="pvp-body">
          <div class="pvp-feats" id="pvp-feats"></div>
          <p class="muted small" data-i18n="pvp.hint"></p>
        </div>
      </div>

      <div class="module-card card ex-card" id="ex-card">
        <div class="module-top">
          <div class="module-ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
          <div class="module-text">
            <h3 data-i18n="ex.title"></h3>
            <p class="muted" data-i18n="ex.sub"></p>
          </div>
        </div>
        <div class="ex-list" id="ex-list"></div>
      </div>
    </section>

    <!-- CAPES -->
    <section class="page" id="page-capes">
      <div class="wr-tabs tabs" id="wr-tabs">
        <button class="tab active" data-wr="skin"><span data-i18n="wr.skin"></span></button>
        <button class="tab" data-wr="cape"><span data-i18n="wr.cape"></span></button>
      </div>

      <!-- skins -->
      <div class="wr-pane" id="wr-skin">
        <div class="page-head">
          <div><h2 data-i18n="skin.title"></h2><p class="muted" data-i18n="skin.sub"></p></div>
          <label class="btn btn-primary">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="skin.add"></span>
            <input type="file" id="skin-file" accept="image/png" multiple hidden />
          </label>
        </div>
        <div class="notice" id="skin-notice" hidden></div>
        <div class="cape-layout">
          <div class="card cape-stage" id="skin-drop">
            <div class="skin-3d">
              <canvas id="skin-front" width="16" height="32"></canvas>
              <canvas id="skin-back" width="16" height="32"></canvas>
            </div>
            <div class="cape-stage-label"><b id="skin-name"></b><span class="muted" id="skin-size"></span></div>
            <div class="seg" id="skin-variant">
              <button data-v="classic" data-i18n="skin.classic"></button>
              <button data-v="slim" data-i18n="skin.slim"></button>
            </div>
            <button class="btn btn-primary wide" id="skin-apply"><span data-i18n="skin.apply"></span></button>
            <button class="link-btn" id="skin-reset" data-i18n="skin.reset"></button>
            <p class="drop-hint muted small" data-i18n="skin.drop"></p>
          </div>
          <div>
            <div class="skin-import">
              <input id="skin-import-name" type="text" maxlength="16" spellcheck="false" autocomplete="off" />
              <button class="btn btn-ghost" id="skin-import" data-i18n="skin.import"></button>
            </div>
            <div class="cape-grid" id="skin-grid"></div>
          </div>
        </div>
      </div>

      <!-- capes -->
      <div class="wr-pane" id="wr-cape" hidden>
      <div class="page-head">
        <div><h2 data-i18n="cape.title"></h2><p class="muted" data-i18n="cape.sub"></p></div>
        <label class="btn btn-primary" id="cape-add-btn">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="cape.add"></span>
          <input type="file" id="cape-file" accept="image/*" multiple hidden />
        </label>
      </div>
      <div class="notice" id="cape-notice" hidden></div>
      <div class="cape-layout">
        <div class="card cape-stage" id="cape-drop">
          <div class="cape-3d" id="cape-3d">
            <canvas id="cape-front" width="10" height="16"></canvas>
            <canvas id="cape-back" width="10" height="16"></canvas>
          </div>
          <div class="cape-stage-label"><b id="cape-name"></b><span class="muted" id="cape-size"></span></div>
          <div class="seg" id="cape-mode">
            <button data-v="local" data-i18n="cape.local"></button>
            <button data-v="account" data-i18n="cape.account"></button>
            <button data-v="none" data-i18n="cape.none"></button>
          </div>
          <p class="drop-hint muted small" data-i18n="cape.drop"></p>
        </div>
        <div class="cape-grid" id="cape-grid"></div>
      </div>
      </div>
    </section>

    <section class="page" id="page-settings">
      <div class="page-head">
        <div><h2 data-i18n="set.title"></h2><p class="muted" data-i18n="set.sub"></p></div>
      </div>
      <div class="settings">
        <div class="card set-card">
          <h3 data-i18n="set.general"></h3>
          <div class="field">
            <label data-i18n="set.language"></label>
            <div class="seg" id="set-lang"><button data-v="ru">Русский</button><button data-v="uk">Українська</button><button data-v="en">English</button></div>
          </div>
          <div class="field">
            <label data-i18n="set.version"></label>
            <select id="set-version"></select>
          </div>
          <div class="field">
            <label data-i18n="set.playMode"></label>
            <div class="seg" id="set-playmode">
              <button data-v="auto" data-i18n="set.pm.auto"></button>
              <button data-v="official" data-i18n="set.pm.official"></button>
              <button data-v="direct" data-i18n="set.pm.direct"></button>
            </div>
            <small class="muted" id="playmode-hint"></small>
          </div>
          <label class="toggle"><input type="checkbox" id="set-autojoin" /><i></i><span data-i18n="set.autojoin"></span></label>
          <label class="toggle"><input type="checkbox" id="set-close" /><i></i><span data-i18n="set.close"></span></label>
          <label class="toggle"><input type="checkbox" id="set-motion" /><i></i><span data-i18n="set.motion"></span></label>
          <label class="toggle"><input type="checkbox" id="set-intro" /><i></i><span data-i18n="set.intro"></span></label>
          <div class="field">
            <label data-i18n="set.home"></label>
            <div class="seg" id="set-home">
              <button data-v="new" data-i18n="home.layout.new"></button>
              <button data-v="classic" data-i18n="home.layout.classic"></button>
            </div>
          </div>
        </div>

        <div class="card set-card">
          <h3 data-i18n="set.perf"></h3>
          <div class="field">
            <label><span data-i18n="set.memory"></span> <b class="accent" id="mem-label"></b></label>
            <input type="range" id="set-mem" min="1024" step="512" />
            <small class="muted" id="mem-hint"></small>
          </div>
          <div class="field">
            <label data-i18n="set.gc"></label>
            <div class="seg seg-col" id="set-gc">
              <button data-v="balanced" data-i18n="set.gc.balanced"></button>
              <button data-v="lowlatency" data-i18n="set.gc.lowlatency"></button>
            </div>
          </div>
          <div class="field two">
            <label data-i18n="set.resolution"></label>
            <div class="res"><input type="number" id="set-w" min="640" /><span>×</span><input type="number" id="set-h" min="480" /></div>
          </div>
        </div>

        <div class="card set-card">
          <h3 data-i18n="set.mods"></h3>
          <div class="field">
            <label data-i18n="set.cfKey"></label>
            <input type="password" id="set-cf" autocomplete="off" placeholder="$2a$10$…" />
            <small class="muted" data-i18n="set.cfHint"></small>
          </div>
          <div class="field">
            <label data-i18n="set.java"></label>
            <input type="text" id="set-java" spellcheck="false" />
            <small class="muted" data-i18n="set.javaHint"></small>
          </div>
          <div class="field">
            <label data-i18n="set.jvm"></label>
            <input type="text" id="set-jvm" spellcheck="false" placeholder="-XX:+…" />
          </div>
        </div>

        <div class="card set-card">
          <h3 data-i18n="set.folders"></h3>
          <div class="folder-btns">
            <button class="btn btn-ghost" data-open="root" data-i18n="set.openRoot"></button>
            <button class="btn btn-ghost" data-open="instance" data-i18n="set.openGame"></button>
            <button class="btn btn-ghost" data-open="logs" data-i18n="set.openLogs"></button>
          </div>
          <p class="muted small mono" id="data-dir"></p>
          <p class="muted small" id="app-version"></p>
        </div>
      </div>
    </section>
  </main>

  <!-- Login dialog -->
  <div class="modal" id="login-modal" hidden>
    <div class="modal-card" id="login-window-card">
      <div class="ms-head">
        <svg class="ms-logo" viewBox="0 0 24 24"><rect x="2" y="2" width="9.5" height="9.5" fill="#f25022" stroke="none"/><rect x="12.5" y="2" width="9.5" height="9.5" fill="#7fba00" stroke="none"/><rect x="2" y="12.5" width="9.5" height="9.5" fill="#00a4ef" stroke="none"/><rect x="12.5" y="12.5" width="9.5" height="9.5" fill="#ffb900" stroke="none"/></svg>
        <h3 data-i18n="acc.title"></h3>
      </div>
      <p class="muted" id="login-window-text" data-i18n="acc.windowOpen"></p>
      <div class="waiting"><i class="spinner"></i><span id="login-window-state" data-i18n="acc.waitingWindow"></span></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="login-cancel-w" data-i18n="acc.cancel"></button>
        <button class="btn btn-soft" id="login-use-code" data-i18n="acc.useCode"></button>
      </div>
    </div>
    <div class="modal-card" id="login-code-card" hidden>
      <h3 data-i18n="acc.title"></h3>
      <ol class="steps">
        <li><span data-i18n="acc.step1"></span><button class="btn btn-soft" id="login-open" data-i18n="acc.open"></button></li>
        <li><span data-i18n="acc.step2"></span><button class="code" id="login-code" title="Copy"></button></li>
      </ol>
      <div class="waiting"><i class="spinner"></i><span data-i18n="acc.waiting"></span></div>
      <button class="btn btn-ghost" id="login-cancel" data-i18n="acc.cancel"></button>
    </div>
  </div>

  <!-- Playing through the official Minecraft Launcher -->
  <div class="modal" id="off-modal" hidden>
    <div class="modal-card">
      <div class="ms-head"><img src="assets/logo.svg" alt="" width="34" height="34" class="pixel" /><h3 data-i18n="off.title"></h3></div>
      <ol class="steps">
        <li><span data-i18n="off.s1"></span></li>
        <li><span data-i18n="off.s2"></span></li>
        <li><span data-i18n="off.s3"></span></li>
      </ol>
      <div class="notice" id="off-missing" hidden><span data-i18n="off.missing"></span></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="off-close" data-i18n="off.close"></button>
        <button class="btn btn-primary" id="off-download" hidden data-i18n="off.download"></button>
        <button class="btn btn-primary" id="off-go" data-i18n="off.go"></button>
      </div>
    </div>
  </div>

  <!-- Create / edit a profile -->
  <div class="modal" id="prof-modal" hidden>
    <div class="modal-card prof-card">
      <div class="ms-head"><img src="assets/logo.svg" alt="" width="34" height="34" class="pixel" /><h3 id="prof-modal-title"></h3></div>
      <div class="field">
        <label data-i18n="prof.name"></label>
        <input type="text" id="prof-name" maxlength="24" spellcheck="false" autocomplete="off" />
      </div>
      <div class="field">
        <label data-i18n="prof.version"></label>
        <select id="prof-version"></select>
      </div>
      <label class="toggle prof-q"><input type="checkbox" id="prof-perf" /><i></i>
        <span><b data-i18n="prof.q.perf"></b><small data-i18n="prof.q.perfSub"></small></span></label>
      <label class="toggle prof-q"><input type="checkbox" id="prof-std" /><i></i>
        <span><b data-i18n="prof.q.std"></b><small data-i18n="prof.q.stdSub"></small></span></label>
      <p class="muted small" data-i18n="prof.note"></p>
      <div class="modal-actions">
        <button class="btn btn-danger" id="prof-delete" hidden></button>
        <button class="btn btn-ghost" id="prof-cancel" data-i18n="prof.cancel"></button>
        <button class="btn btn-primary" id="prof-save"></button>
      </div>
    </div>
  </div>

  <!-- Cape editor: any picture, moved and zoomed into place -->
  <div class="modal" id="cape-edit" hidden>
    <div class="modal-card ce-card">
      <div><h3 data-i18n="ce.title"></h3><p class="muted small" data-i18n="ce.sub"></p></div>
      <div class="ce-body">
        <div class="ce-stage"><canvas id="ce-canvas" width="320" height="512"></canvas></div>
        <div class="ce-side">
          <div class="field">
            <label data-i18n="ce.zoom"></label>
            <input type="range" id="ce-zoom" min="100" max="400" value="100" />
          </div>
          <div class="field">
            <label data-i18n="ce.name"></label>
            <input type="text" id="ce-name" maxlength="32" spellcheck="false" autocomplete="off" />
          </div>
          <div class="ce-prev">
            <canvas id="ce-prev" width="80" height="128"></canvas>
            <span class="muted small" data-i18n="ce.hint"></span>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="ce-cancel" data-i18n="prof.cancel"></button>
        <button class="btn btn-primary" id="ce-save" data-i18n="ce.save"></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="i18n.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
