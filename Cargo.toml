[workspace]
resolver = "2"
members = ["crates/stray-core", "src-tauri"]

[workspace.package]
version = "1.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MuMaFi/StrayClient"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "rustls-tls-native-roots", "http2", "gzip", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Fast but small release builds
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
